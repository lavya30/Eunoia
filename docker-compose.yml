services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eunoia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - eunoia-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eunoia"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - eunoia-redis:/data

  sync-server:
    build:
      context: .
      dockerfile: packages/sync-server/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/eunoia?schema=public
      REDIS_URL: redis://redis:6379
      D2_COMPILER_URL: http://d2-compiler:9400/compile
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      d2-compiler:
        condition: service_healthy

  d2-compiler:
    build:
      context: services/d2-compiler
    ports:
      - "9400:9400"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9400/healthz | grep -q '\"status\":\"ok\"'"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  eunoia-postgres:
  eunoia-redis:
