name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Frontend: Lint, Format, Type-check, Build
  # ──────────────────────────────────────────────
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (ESLint)
        run: bun lint

      - name: Format check (Prettier)
        run: bun run format:check

      - name: Type check (TypeScript)
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build

  # ──────────────────────────────────────────────
  # Sync server: CRDT, persistence, and telemetry
  # ──────────────────────────────────────────────
  sync-server:
    name: Sync Server CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sync-server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: eunoia
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eunoia"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun test

  # ──────────────────────────────────────────────
  # NFR perf gates, per-PR fast subset (PRD §5, docs/SLO.md).
  # Full matrix (E2E compile, latency matrix, soak, flush) runs in
  # nfr-nightly.yml. Flake protocol: retry once, upload the bench output
  # as an artifact; file an issue on the 2nd consecutive nightly red.
  # ──────────────────────────────────────────────
  nfr-fast:
    name: NFR fast gates (per-PR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Frontend benches (NFR-1 culling + FPS proxy, NFR-3 unit, NFR-4 memory)
        working-directory: frontend
        run: bun run bench:fast && bun run bench:fps && bun run bench:memory

      - name: Delta sizes (NFR-5)
        working-directory: packages/sync-server
        run: bun scripts/delta-size.ts --samples=50

      - name: Sync latency smoke (NFR-2, reduced samples; full matrix is nightly)
        working-directory: packages/sync-server
        run: bun scripts/latency-probe.ts --samples=30
