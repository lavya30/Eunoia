# Upptime status-page + external prober configuration (Upptime reads
# `.upptimerc.yml` in the repo root).
#
# At Pro launch, replace `YOUR-PROD-HOST` with the production sync-server
# origin and set the `GH_PAT` secret (classic PAT with `repo` scope — the
# stock GITHUB_TOKEN cannot push the status-site commits). The workflows in
# `.github/workflows/uptime*.yml` + `response-time.yml` do the rest: probe
# `/health` + `/readyz` from 2+ regions and keep the server-side uptime
# history that backs SLA credits (docs/SLO.md).
# Until then probing stays browser-local (see StatusPage.tsx).
#
# Upptime opens one GitHub issue per outage and assigns the current
# primary (see `assignees` below + docs/RUNBOOK.md on-call rotation).

owner: lavya30
repo: Eunoia

sites:
  - name: Sync API (liveness)
    url: https://YOUR-PROD-HOST/health
    expectedStatusCodes: [200]
    # On-call primary gets auto-assigned to incident issues.
    # Fill with the current primary's GitHub username at launch (weekly
    # rotation chore, see docs/RUNBOOK.md); empty until then.
    assignees: []
  - name: Sync readiness
    url: https://YOUR-PROD-HOST/readyz
    expectedStatusCodes: [200]
    assignees: []

status-website:
  # Base URL of the deployed status page (Upptime README action).
  baseUrl: /Eunoia
  logoUrl: https://raw.githubusercontent.com/lavya30/Eunoia/dev/frontend/public/logo.png
  name: Eunoia status
  introTitle: Eunoia real-time sync status
  introMessage: Live availability of the sync API, readiness checks, and incident history.
  navbar:
    - title: App
      url: https://YOUR-PROD-HOST

# SLO: 99.9% over 30 days (~43m budget). ready/degraded count as up;
# only `down`/unreachable open incidents (see docs/SLO.md).
i18n:
  footer: Eunoia · probes every 60s from 2+ regions · SLA record lives here once enabled
